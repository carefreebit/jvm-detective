name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Unit tests
        run: mvn -B -ntp verify

      - name: Smoke test - detect a real deadlock
        run: |
          set +e
          java -jar target/jvmd.jar demo deadlock --samples 3 --interval-ms 200 -o smoke
          code=$?
          set -e
          test -f "$(find smoke -name report.html | head -n 1)"
          test "$code" -eq 2

      - name: Smoke test - parse a dump without attaching
        run: |
          dump="$(find smoke -name thread-dump.txt | head -n 1)"
          set +e
          java -jar target/jvmd.jar analyze "$dump" -o analyzed --print json > analyzed.json
          code=$?
          set -e
          test "$code" -eq 2
          grep -q '"id" : "deadlock"' analyzed.json

      - name: Upload sample report
        if: matrix.java == '21'
        uses: actions/upload-artifact@v4
        with:
          name: sample-report
          path: smoke/**/report.html
          if-no-files-found: error

  package:
    name: Package shaded jar
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -ntp -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: jvmd-jar
          path: target/jvmd.jar
